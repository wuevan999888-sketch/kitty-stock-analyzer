<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiwan Stock Market Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Taiwan Stock Market Analysis</h1>
    <div id="stockData"></div>
    <script>
        const fetchData = async () => {
            try {
                const response = await axios.get('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMarket');
                const stockData = response.data.data;
                const stockDataDiv = document.getElementById('stockData');
                stockData.forEach(stock => {
                    stockDataDiv.innerHTML += `<p>${stock.stock_id}: ${stock.price}</p>`;
                });
            } catch (error) {
                console.error('Error fetching data: ', error);
            }
        };

        fetchData();
    </script>
</body>
</html>
